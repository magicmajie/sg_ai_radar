name: Build and deploy site

on:
  push:
    branches: [main]
    paths:
      - "events/**"
      - "issues/**"
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  schedule:
    # 00:05 Singapore time every day, so finished events move to "往期"
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Build site
        run: python scripts/build_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
